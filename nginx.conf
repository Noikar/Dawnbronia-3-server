# Static file host for the client auto-updater. Serves client_dist/ read-only.
# Defense-in-depth on top of the read-only, scope-limited bind mount.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Read-only service: reject anything but plain reads.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Never serve dotfiles (e.g. a stray .git, .env) even if one lands in the tree.
    location ~ /\. {
        deny all;
    }

    # No directory listings; a missing file is a clean 404.
    location / {
        autoindex off;
        try_files $uri =404;
    }
}
