services:
  db:
    image: mariadb:10.11
    container_name: astonia3-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env (copy .env.example)}
      MYSQL_DATABASE: merc
    ports:
      # Loopback-only: lets host tools / a local MCP client reach MariaDB. Not exposed publicly.
      # Host port 13306 (not 3306) avoids clashing with a native mysqld already on this host.
      - "127.0.0.1:13306:3306"
    volumes:
      - astonia3-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - astonia3-net

  server:
    image: ${DOCKER_IMAGE:-astoniacommunity/astonia_server_3:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astonia3-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AS3_DBHOST: db
      AS3_DBUSER: root
      AS3_DBPASS: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env (copy .env.example)}
      AS3_DBNAME: merc
      AS3_CHATHOST: localhost
    ports:
      # Chat server (internal communication, usually not exposed publicly)
      # - "5554:5554"
      # Game server ports - area servers (36 areas bind 5556-5591; io.c allows
      # up to 5599, so map the full range to match the Dockerfile EXPOSE).
      - "5556-5599:5556-5599"
    volumes:
      # Persist server logs (optional)
      - ./logs:/server/logs
      # Persist Live Quest saves (/questsave writes quest/<name>.qst here)
      - ./quest:/server/quest
      # DO NOT bind-mount zone directories. The server is a 32-bit i386 binary,
      # and 32-bit readdir() fails with EOVERFLOW on inode numbers that do not
      # fit in 32 bits. Docker Desktop's mounts hand out inodes in the
      # 10^15 range (the image's overlayfs stays around 10^5), so load_zones()
      # enumerates a mounted zone dir as EMPTY and the area silently comes up
      # with no map, no items and no characters. Measured 2026-07-22.
      #
      # To push content without an image rebuild, copy it into the container's
      # own filesystem instead, then reload just that area:
      #   docker cp zones/38/. astonia3-server:/server/zones/38/
      #   /zone off 38   then   /zone on 38     (in game, god)
      # Rebuild the image to make it permanent -- docker cp is lost on recreate.
    networks:
      - astonia3-net

volumes:
  astonia3-db-data:

networks:
  astonia3-net:
    driver: bridge
